<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduShield - Premium Remedial Learning Portal</title>
  <meta name="description" content="EduShield is an intelligent educational dashboard mapping remedial study flows, assessments, and teacher reviews to unlock knowledge gaps.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Wrapper Shell -->
  <div class="app-container">
    
    <!-- Sidebar Navigation Drawer -->
    <aside class="sidebar" id="app-sidebar">
      <!-- Generated Dynamically by JS -->
    </aside>

    <!-- Main Workspace Frame -->
    <main class="main-content">
      
      <!-- Top Action Bar -->
      <header class="top-header" id="app-header">
        <!-- Generated Dynamically by JS -->
      </header>

      <!-- Central Content viewport -->
      <div id="app-content-root">
        <!-- Dashboard panels populated dynamically -->
      </div>

    </main>
  </div>

  <!-- Toast Notification Overlay -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ==========================================
       MODALS DIALOGS
       ========================================== -->

  <!-- Modal 1: Teacher Schedule Remedial Group -->
  <div class="modal-overlay" id="schedule-group-modal">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3>Schedule Small Remedial Group</h3>
        <button class="modal-close-btn" onclick="closeModal('schedule-group-modal')">&times;</button>
      </div>
      <form onsubmit="submitScheduleGroup(event)">
        <div class="form-group">
          <label class="form-label" for="schedule-topic">Subject Topic Gap</label>
          <select class="form-input" id="schedule-topic" required>
            <option value="linear_equations">Mathematics: Linear Equations in One Variable</option>
            <option value="fractions">Mathematics: Fractions & Decimals</option>
            <option value="ratios">Mathematics: Ratio & Proportion</option>
            <option value="photosynthesis">Science: Photosynthesis</option>
            <option value="newtons_laws">Science: Newton's Laws of Motion</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="schedule-datetime">Session Date & Time</label>
          <input type="datetime-local" class="form-input" id="schedule-datetime" required>
        </div>
        <div class="form-group">
          <label class="form-label">Add Students to Session</label>
          <div id="schedule-students-container" style="max-height: 120px; overflow-y: auto; padding: 10px; border: 1px solid var(--border-light); border-radius: var(--border-radius-md); background: rgba(0,0,0,0.15)">
            <!-- Checklist loaded dynamically -->
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="schedule-remarks">Remedial Focus Instructions</label>
          <textarea class="form-input" id="schedule-remarks" rows="3" placeholder="Describe specific concepts to cover (e.g. balancing methods)..."></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('schedule-group-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Schedule Session</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Teacher Modify Remarks -->
  <div class="modal-overlay" id="teacher-remarks-modal">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3>Submit Student Remedial Remarks</h3>
        <button class="modal-close-btn" onclick="closeModal('teacher-remarks-modal')">&times;</button>
      </div>
      <form onsubmit="submitRemarks(event)">
        <div class="form-group">
          <label class="form-label" for="remarks-content">Audit Feedback Remarks</label>
          <textarea class="form-input" id="remarks-content" rows="5" required placeholder="Write guidelines and feedback to help this student improve..."></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('teacher-remarks-modal')">Cancel</button>
          <button type="submit" class="btn btn-success">Update Remarks</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 3: Staff Edit Materials Curriculum -->
  <div class="modal-overlay" id="edit-materials-modal">
    <div class="modal-content glass-panel" style="max-width: 780px;">
      <div class="modal-header">
        <div>
          <h3>Edit Remedial Materials</h3>
          <span style="font-size:0.875rem; color:var(--text-muted);" id="edit-topic-name">Topic Name</span>
        </div>
        <button class="modal-close-btn" onclick="closeModal('edit-materials-modal')">&times;</button>
      </div>
      <form onsubmit="submitEditMaterials(event)">
        <div class="editor-pane-grid">
          
          <!-- Column 1: Core Notes -->
          <div>
            <h4 style="margin-bottom:12px; border-bottom: 1px solid var(--border-light); padding-bottom:6px; color:#818cf8">Standard Curriculum</h4>
            <div class="form-group">
              <label class="form-label" for="editor-notes-concept">Key Concept Explanation</label>
              <textarea class="form-input" id="editor-notes-concept" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="editor-notes-example">Step-by-Step Example</label>
              <textarea class="form-input" id="editor-notes-example" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="editor-notes-mistake">Common Mistake</label>
              <textarea class="form-input" id="editor-notes-mistake" rows="3" required></textarea>
            </div>
          </div>

          <!-- Column 2: Failure Mitigation Simpler Notes -->
          <div>
            <h4 style="margin-bottom:12px; border-bottom: 1px solid var(--border-light); padding-bottom:6px; color:var(--color-warning)">Failure Revision Path</h4>
            <div class="form-group">
              <label class="form-label" for="editor-simpler-concept">Simpler Concept Analogy</label>
              <textarea class="form-input" id="editor-simpler-concept" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="editor-simpler-example">Simplified Daily Example</label>
              <textarea class="form-input" id="editor-simpler-example" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="editor-simpler-videotitle">Revision Video Title</label>
              <input type="text" class="form-input" id="editor-simpler-videotitle" required>
            </div>
          </div>

        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('edit-materials-modal')">Close Editor</button>
          <button type="submit" class="btn btn-primary">Save Curriculum Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 4: Admin Create User Account -->
  <div class="modal-overlay" id="add-user-modal">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3>Create New User Account</h3>
        <button class="modal-close-btn" onclick="closeModal('add-user-modal')">&times;</button>
      </div>
      <form onsubmit="submitAddUser(event)">
        <div class="form-group">
          <label class="form-label" for="user-add-name">Full Name</label>
          <input type="text" class="form-input" id="user-add-name" required placeholder="e.g. Ramesh Chandra">
        </div>
        <div class="form-group">
          <label class="form-label" for="user-add-role">System Role</label>
          <select class="form-input" id="user-add-role" required>
            <option value="student">Student</option>
            <option value="teacher">Class Teacher</option>
            <option value="staff">Subject Teacher (Staff)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="user-add-detail">Class / Subject Mapping</label>
          <input type="text" class="form-input" id="user-add-detail" required placeholder="e.g. Grade 8-A (for Students/Teachers) or math (for Staff)">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('add-user-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Account</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 5: Teacher New Message -->
  <div class="modal-overlay" id="new-message-modal">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3>Send Communication Message</h3>
        <button class="modal-close-btn" onclick="closeModal('new-message-modal')">&times;</button>
      </div>
      <form onsubmit="submitMessage(event)">
        <div class="form-group">
          <label class="form-label" for="msg-to">Recipient (Staff/Parents)</label>
          <input type="text" class="form-input" id="msg-to" required placeholder="e.g. Mr. Rajesh Kumar or Amit's Parents">
        </div>
        <div class="form-group">
          <label class="form-label" for="msg-content">Message Content</label>
          <textarea class="form-input" id="msg-content" rows="4" required placeholder="Type your notification description here..."></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('new-message-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Dispatch Message</button>
        </div>
      </form>
    </div>
  </div>

  <!-- App Main Logic Script -->
  <script src="app.js"></script>
</body>
</html>
